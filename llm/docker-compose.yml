version: '3.8'

services:
  # Ollama - Runs Hermes models
  ollama:
    image: ollama/ollama:latest
    container_name: ollama-hermes
    hostname: ollama
    ports:
      - "11434:11434"  # Ollama API
    volumes:
      - ollama_data:/root/.ollama
      - ./ollama/entrypoint.sh:/entrypoint.sh
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_ORIGINS=*
      - OLLAMA_MODELS=/root/.ollama
    restart: unless-stopped
    stdin_open: true
    tty: true
    # Health check for 24/7
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '1'
          memory: 2G
    networks:
      - llm-network
      - vps-network

  # LiteLLM Proxy - LLM API Router (OpenAI compatible)
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm-router
    hostname: litellm
    ports:
      - "4000:4000"  # LiteLLM Proxy API
    volumes:
      - ./litellm/litellm-config.yaml:/app/config.yaml
      - litellm_data:/app/data
    environment:
      - LITELLM_MASTER_KEY=sk-1234
      - LITELLM_SALT_KEY=sk-salt-1234
      - DATABASE_URL=sqlite:////app/data/litellm.db
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - TOGETHER_API_KEY=${TOGETHER_API_KEY:-}
      - LITELLM_LOG=INFO
    command: --config /app/config.yaml --port 4000 --num_workers 2 --detailed_debug
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    networks:
      - llm-network
      - vps-network

  # Custom Node.js Router (Fallback / Lightweight alternative to LiteLLM)
  llm-router:
    build:
      context: ./router
      dockerfile: Dockerfile
    container_name: hermes-router
    hostname: hermes-router
    ports:
      - "4001:4001"  # Custom router API
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - LITELLM_HOST=http://litellm:4000
      - PORT=4001
      - MASTER_KEY=sk-1234
      - VPS_USER=Mikasa
      - VPS_PASS=Eren@Home$123
    volumes:
      - ./router:/app
      - /app/node_modules
    restart: unless-stopped
    depends_on:
      - ollama
      - litellm
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - llm-network
      - vps-network
    profiles:
      - custom-router

  # Open WebUI - Chat UI for Hermes (Optional)
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui-hermes
    hostname: open-webui
    ports:
      - "3000:8080"  # WebUI
    volumes:
      - open_webui_data:/app/backend/data
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - WEBUI_NAME=FreeVPS Hermes - Mikasa
      - DEFAULT_USER_ROLE=user
      - ENABLE_SIGNUP=true
      - WEBUI_AUTH_TRUSTED_EMAIL_HEADER=X-Forwarded-Email
    restart: unless-stopped
    depends_on:
      - ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - llm-network
      - vps-network
    profiles:
      - ui

volumes:
  ollama_data:
    driver: local
  litellm_data:
    driver: local
  open_webui_data:
    driver: local

networks:
  llm-network:
    driver: bridge
    name: llm-network
  vps-network:
    driver: bridge
    name: vps-network
    external: false
