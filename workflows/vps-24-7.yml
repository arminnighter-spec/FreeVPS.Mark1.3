name: FreeVPS Mark1.3 - 24/7 VPS + Hermes LLM

on:
  workflow_dispatch:
    inputs:
      vps_user:
        description: 'VPS Username'
        required: false
        default: 'Mikasa'
      enable_tmate:
        description: 'Enable tmate SSH'
        required: false
        default: 'true'
      enable_ttyd:
        description: 'Enable ttyd web terminal'
        required: false
        default: 'true'
      enable_code_server:
        description: 'Enable code-server (VS Code)'
        required: false
        default: 'true'
      enable_tailscale:
        description: 'Enable Tailscale VPN'
        required: false
        default: 'false'
      enable_llm:
        description: 'Enable Hermes LLM + LiteLLM Router (Ollama)'
        required: false
        default: 'true'
      llm_model:
        description: 'Hermes model to pull (for low RAM use 2b/3b)'
        required: false
        default: 'nous-hermes2:2b'
  push:
    branches: [ main, arena/* ]
  schedule:
    - cron: '0 */5 * * *'
  repository_dispatch:
    types: [ restart-vps ]

env:
  VPS_USER: Mikasa
  VPS_USER_LOWER: mikasa
  VPS_PASS: Eren@Home$123
  MAIN_PORT: 8080
  TTYD_PORT: 7681
  CODE_PORT: 8081
  OLLAMA_PORT: 11434
  LITELLM_PORT: 4000
  ROUTER_PORT: 4001
  DEBIAN_FRONTEND: noninteractive

jobs:
  vps:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: System Info
        run: |
          echo "=== FreeVPS Mark1.3 System Info ==="
          echo "Date: $(date)"
          echo "Runner: $(hostname)"
          echo "OS: $(uname -a)"
          echo "User: $(whoami)"
          echo "VPS User: $VPS_USER / $VPS_USER_LOWER"
          echo "RAM: $(free -h | grep Mem)"
          echo "CPU: $(lscpu | grep 'Model name')"
          echo "=================================="
          lscpu
          free -h
          df -h

      - name: Create VPS User Mikasa
        run: |
          echo "Creating user $VPS_USER_LOWER with password..."
          sudo useradd -m -s /bin/bash $VPS_USER_LOWER || echo "User may already exist"
          echo "$VPS_USER_LOWER:$VPS_PASS" | sudo chpasswd
          sudo usermod -aG sudo $VPS_USER_LOWER
          echo "$VPS_USER_LOWER ALL=(ALL) NOPASSWD:ALL" | sudo tee /etc/sudoers.d/$VPS_USER_LOWER
          sudo chmod 440 /etc/sudoers.d/$VPS_USER_LOWER
          sudo useradd -m -s /bin/bash Mikasa 2>/dev/null || true
          echo "Mikasa:$VPS_PASS" | sudo chpasswd 2>/dev/null || true
          sudo usermod -aG sudo Mikasa 2>/dev/null || true
          id $VPS_USER_LOWER

      - name: Install System Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            curl wget git htop nano vim tmux screen \
            openssh-server supervisor net-tools lsof \
            unzip zip build-essential python3 python3-pip \
            neofetch jq fail2ban ufw libssl-dev
          
          echo "Installing ttyd..."
          sudo apt-get install -y ttyd 2>/dev/null || {
            wget -q https://github.com/tsl0922/ttyd/releases/download/1.7.7/ttyd.x86_64 -O /tmp/ttyd
            chmod +x /tmp/ttyd
            sudo mv /tmp/ttyd /usr/local/bin/ttyd
          }
          
          echo "Installing code-server..."
          curl -fsSL https://code-server.dev/install.sh | sh
          code-server --version || true

      - name: Setup SSH Server
        run: |
          sudo mkdir -p /var/run/sshd /run/sshd
          sudo sed -i 's/#*PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo sed -i 's/#*PermitRootLogin.*/PermitRootLogin yes/' /etc/ssh/sshd_config
          sudo ssh-keygen -A
          sudo /usr/sbin/sshd || sudo service ssh start
          pgrep sshd
          sudo ss -tlnp | grep :22 || true

      - name: Install Node Dependencies
        run: |
          npm ci || npm install
          echo "Node modules installed"

      - name: Install Ollama + Hermes LLM (Selected Stack)
        if: ${{ github.event.inputs.enable_llm != 'false' }}
        run: |
          echo "=== Installing Ollama + Hermes LLM ==="
          echo "Selected Stack: Ollama (runner) + LiteLLM Proxy (router)"
          echo "Why: Best for 24/7 - lightweight, OpenAI compatible, routing, fallback, health checks"
          echo "Model: ${{ github.event.inputs.llm_model || 'nous-hermes2:2b' }}"
          
          # Install Ollama
          curl -fsSL https://ollama.com/install.sh | sh
          ollama --version
          
          # Start Ollama
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          echo $! > /tmp/ollama.pid
          sleep 5
          
          # Wait for ready
          for i in {1..20}; do
            if curl -s http://localhost:11434/api/tags > /dev/null 2>&1; then
              echo "Ollama ready!"
              break
            fi
            echo "Waiting for Ollama... $i"
            sleep 2
          done
          
          # Pull Hermes model (lightweight for GitHub Actions)
          MODEL="${{ github.event.inputs.llm_model || 'nous-hermes2:2b' }}"
          echo "Pulling Hermes model: $MODEL (this may take 2-5 min)..."
          ollama pull $MODEL || ollama pull nous-hermes2:2b || ollama pull hermes3:3b
          
          # Also pull fallback
          ollama pull hermes3:3b 2>&1 | tail -5 || true
          
          echo "Available models:"
          ollama list
          curl -s http://localhost:11434/api/tags | jq || cat /tmp/ollama.log | tail -20

      - name: Install LiteLLM Proxy - Selected LLM API Router
        if: ${{ github.event.inputs.enable_llm != 'false' }}
        run: |
          echo "=== Installing LiteLLM Proxy (Selected Router) ==="
          echo "LiteLLM is OpenAI compatible, supports routing, load balancing, fallback, 24/7 health checks"
          
          pip3 install 'litellm[proxy]' --break-system-packages || pip3 install 'litellm[proxy]' || true
          
          # Create config
          mkdir -p llm/litellm
          cat > llm/litellm/litellm-config.yaml << 'EOC'
          model_list:
            - model_name: hermes
              litellm_params:
                model: ollama/nous-hermes2:2b
                api_base: http://localhost:11434
            - model_name: hermes3
              litellm_params:
                model: ollama/hermes3:3b
                api_base: http://localhost:11434
            - model_name: nous-hermes2
              litellm_params:
                model: ollama/nous-hermes2:2b
                api_base: http://localhost:11434
            - model_name: hermes-light
              litellm_params:
                model: ollama/nous-hermes2:2b
                api_base: http://localhost:11434
          EOC
          
          # Start LiteLLM
          nohup litellm --config llm/litellm/litellm-config.yaml --port 4000 > /tmp/litellm.log 2>&1 &
          echo $! > /tmp/litellm.pid
          sleep 5
          
          echo "LiteLLM status:"
          curl -s http://localhost:4000/health || curl -s http://localhost:4000/ || cat /tmp/litellm.log | tail -20
          echo ""
          echo "Models via LiteLLM:"
          curl -s http://localhost:4000/v1/models -H "Authorization: Bearer sk-1234" | jq || true

      - name: Start Custom Hermes Router (Fallback)
        if: ${{ github.event.inputs.enable_llm != 'false' }}
        run: |
          echo "Starting custom Hermes router on port 4001..."
          cd llm/router
          npm install --production 2>&1 | tail -5 || true
          PORT=4001 OLLAMA_HOST=http://localhost:11434 LITELLM_HOST=http://localhost:4000 nohup node router.js > /tmp/hermes-router.log 2>&1 &
          echo $! > /tmp/hermes-router.pid
          cd ../..
          sleep 3
          curl -s http://localhost:4001/health | jq || cat /tmp/hermes-router.log | tail -10 || true

      - name: Setup Tailscale (Optional)
        if: ${{ github.event.inputs.enable_tailscale == 'true' || secrets.TAILSCALE_AUTHKEY != '' }}
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          if [ -n "${{ secrets.TAILSCALE_AUTHKEY }}" ]; then
            sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTHKEY }} --hostname=freevps-mark1-3-${{ github.run_id }} || true
            tailscale ip -4 || true
          fi

      - name: Setup Ngrok (Optional)
        if: ${{ secrets.NGROK_AUTH_TOKEN != '' }}
        run: |
          curl -s https://ngrok.com/download/deb | sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt-get update && sudo apt-get install ngrok -y
          ngrok config add-authtoken ${{ secrets.NGROK_AUTH_TOKEN }}
          echo "✅ Ngrok configured"

      - name: Create MOTD
        run: |
          sudo tee /etc/motd << EOF
          ╔════════════════════════════════════════════════════╗
          ║         FreeVPS Mark1.3 - 24/7 VPS ONLINE          ║
          ╠════════════════════════════════════════════════════╣
          ║  Username: Mikasa                                   ║
          ║  Password: Eren@Home\$123                            ║
          ║  Status:   24/7 Active via GitHub Actions           ║
          ║  Run ID:   ${{ github.run_id }}                     ║
          ║  LLM:      Hermes + LiteLLM Router (24/7)           ║
          ╚════════════════════════════════════════════════════╝
          EOF
          cat /etc/motd

      - name: Start VPS Services
        run: |
          echo "=== Starting FreeVPS Services ==="
          chmod +x scripts/*.sh
          chmod +x start-vps.sh
          
          PORT=$MAIN_PORT VPS_USER=$VPS_USER VPS_PASS="$VPS_PASS" OLLAMA_HOST=http://localhost:11434 LITELLM_HOST=http://localhost:4000 nohup node server.js > /tmp/dashboard.log 2>&1 &
          echo $! > /tmp/dashboard.pid
          sleep 3
          cat /tmp/dashboard.log | tail -10 || true
          
          if [ "${{ github.event.inputs.enable_ttyd }}" != "false" ]; then
            nohup ttyd -p $TTYD_PORT -c $VPS_USER_LOWER:$VPS_PASS bash > /tmp/ttyd.log 2>&1 &
            echo $! > /tmp/ttyd.pid
            sleep 2
          fi
          
          if [ "${{ github.event.inputs.enable_code_server }}" != "false" ]; then
            mkdir -p ~/.config/code-server
            cat > ~/.config/code-server/config.yaml << EOC
          bind-addr: 0.0.0.0:$CODE_PORT
          auth: password
          password: $VPS_PASS
          cert: false
          EOC
            nohup code-server --bind-addr 0.0.0.0:$CODE_PORT --auth password > /tmp/code-server.log 2>&1 &
            echo $! > /tmp/code-server.pid
            sleep 3
          fi
          
          if [ -n "${{ secrets.NGROK_AUTH_TOKEN }}" ]; then
            nohup ngrok http $MAIN_PORT --log=/tmp/ngrok-dashboard.log > /tmp/ngrok.log 2>&1 &
            nohup ngrok http $LITELLM_PORT --log=/tmp/ngrok-litellm.log > /tmp/ngrok-litellm2.log 2>&1 &
            nohup ngrok http $OLLAMA_PORT --log=/tmp/ngrok-ollama.log > /tmp/ngrok-ollama2.log 2>&1 &
            sleep 5
            curl -s http://localhost:4040/api/tunnels | jq || true
          fi
          
          echo "=== Services Status ==="
          ps aux | grep -E "server.js|ttyd|code-server|sshd|ollama|litellm|router.js" | grep -v grep || true
          ss -tlnp | grep -E "$MAIN_PORT|$TTYD_PORT|$CODE_PORT|11434|4000|4001|22" || true

      - name: Setup tmate Session
        if: ${{ github.event.inputs.enable_tmate != 'false' }}
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: false
          detached: true

      - name: Keep Alive 24/7 - Heartbeat Loop (VPS + LLM)
        run: |
          echo "╔════════════════════════════════════════════════════╗"
          echo "║         FreeVPS Mark1.3 - 24/7 VPS ONLINE          ║"
          echo "║         + Hermes LLM API Router (LiteLLM)          ║"
          echo "╠════════════════════════════════════════════════════╣"
          echo "║  Username: Mikasa                                   ║"
          echo "║  Password: Eren@Home\$123                            ║"
          echo "║  LLM: Hermes (nous-hermes2:2b) + LiteLLM Router     ║"
          echo "║  API: http://localhost:4000/v1/chat/completions     ║"
          echo "║  Auth: Bearer sk-1234                               ║"
          echo "║  Run ID: ${{ github.run_id }}                       ║"
          echo "╚════════════════════════════════════════════════════╝"
          echo ""
          echo "🔗 Access Methods:"
          echo "  • tmate SSH: Check above logs"
          echo "  • Dashboard: http://localhost:$MAIN_PORT (Mikasa / Eren@Home\$123)"
          echo "  • Ollama: http://localhost:11434"
          echo "  • LiteLLM: http://localhost:4000/v1/chat/completions"
          echo "  • Custom Router: http://localhost:4001/v1/chat/completions"
          echo "  • Tailscale: $(tailscale ip -4 2>/dev/null || echo 'Not connected')"
          echo "  • Ngrok: Check ngrok dashboard if token set"
          echo ""
          echo "📊 System Status:"
          neofetch || uname -a
          echo ""
          echo "🧠 LLM Test:"
          curl -s http://localhost:11434/api/tags | jq '.models[].name' || echo "Ollama tags failed"
          curl -s http://localhost:4000/v1/models -H "Authorization: Bearer sk-1234" | jq || echo "LiteLLM models failed"
          echo ""
          echo "💬 Test Hermes:"
          curl -s http://localhost:4000/v1/chat/completions -H "Content-Type: application/json" -H "Authorization: Bearer sk-1234" -d '{"model":"hermes","messages":[{"role":"user","content":"Hello, are you Hermes? Respond in 10 words."}],"max_tokens":50}' | jq || echo "Chat test failed (model may still be loading)"
          echo ""
          
          mkdir -p keepalive
          echo "$(date) - VPS+LLM Started - Run ${{ github.run_id }}" >> keepalive/uptime.log
          
          echo "Starting 24/7 heartbeat loop (VPS + LLM)..."
          
          COUNT=0
          while true; do
            COUNT=$((COUNT+1))
            echo "[$(date)] 💓 Heartbeat #$COUNT - Uptime: $(uptime -p) - Load: $(cat /proc/loadavg | awk '{print $1}')"
            echo "[$(date)] Services: VPS=$(ps aux | grep -E 'server.js' | grep -v grep | wc -l), Ollama=$(curl -s http://localhost:11434/api/tags > /dev/null && echo OK || echo DOWN), LiteLLM=$(curl -s http://localhost:4000/health > /dev/null && echo OK || echo DOWN)"
            
            if ! ps -p $(cat /tmp/dashboard.pid 2>/dev/null) > /dev/null 2>&1; then
              echo "[$(date)] ⚠️ Dashboard down, restarting..."
              PORT=$MAIN_PORT VPS_USER=$VPS_USER VPS_PASS="$VPS_PASS" OLLAMA_HOST=http://localhost:11434 LITELLM_HOST=http://localhost:4000 nohup node server.js > /tmp/dashboard.log 2>&1 &
              echo $! > /tmp/dashboard.pid
            fi
            
            if ! curl -s http://localhost:11434/api/tags > /dev/null 2>&1; then
              echo "[$(date)] ⚠️ Ollama down, restarting..."
              nohup ollama serve > /tmp/ollama.log 2>&1 &
              echo $! > /tmp/ollama.pid
            fi
            
            if ! curl -s http://localhost:4000/health > /dev/null 2>&1 && ! curl -s http://localhost:4000/ > /dev/null 2>&1; then
              echo "[$(date)] ⚠️ LiteLLM down, restarting..."
              nohup litellm --config llm/litellm/litellm-config.yaml --port 4000 > /tmp/litellm.log 2>&1 &
              echo $! > /tmp/litellm.pid
            fi
            
            if [ -n "${{ secrets.NGROK_AUTH_TOKEN }}" ]; then
              echo "[$(date)] Ngrok tunnels:"
              curl -s http://localhost:4040/api/tunnels 2>/dev/null | jq -r '.tunnels[] | "  - \(.name): \(.public_url) -> \(.config.addr)"' 2>/dev/null || echo "  Ngrok API not ready"
            fi
            
            if command -v tailscale &> /dev/null; then
              TAIL_IP=$(tailscale ip -4 2>/dev/null || echo "")
              if [ -n "$TAIL_IP" ]; then
                echo "[$(date)] Tailscale IP: $TAIL_IP"
                echo "[$(date)] LLM API via Tailscale: http://$TAIL_IP:4000/v1/chat/completions"
              fi
            fi
            
            echo "$(date) - Heartbeat #$COUNT - $(uptime) - LLM OK" >> keepalive/heartbeat.log
            tail -100 keepalive/heartbeat.log > /tmp/hb.tmp && mv /tmp/hb.tmp keepalive/heartbeat.log
            
            sleep 300
          done

      - name: Auto-Restart Workflow for 24/7
        if: always()
        run: |
          echo "Workflow ending, attempting auto-restart for 24/7..."
          if [ -n "${{ secrets.GH_PAT }}" ]; then
            curl -X POST -H "Authorization: token ${{ secrets.GH_PAT }}" -H "Accept: application/vnd.github.v3+json" https://api.github.com/repos/${{ github.repository }}/actions/workflows/vps-24-7.yml/dispatches -d '{"ref":"main"}' || echo "Restart trigger failed"
          else
            echo "No GH_PAT secret, relying on cron schedule (every 5h) for 24/7 restart"
          fi
