name: FreeVPS Mark1.3 - 24/7 VPS

on:
  workflow_dispatch:
    inputs:
      vps_user:
        description: 'VPS Username'
        required: false
        default: 'Mikasa'
      enable_tmate:
        description: 'Enable tmate SSH'
        required: false
        default: 'true'
      enable_ttyd:
        description: 'Enable ttyd web terminal'
        required: false
        default: 'true'
      enable_code_server:
        description: 'Enable code-server (VS Code)'
        required: false
        default: 'true'
      enable_tailscale:
        description: 'Enable Tailscale VPN'
        required: false
        default: 'false'
  push:
    branches: [ main, arena/* ]
  schedule:
    # Auto restart every 6 hours to stay within GitHub's 6h limit, achieves 24/7 via restarts
    - cron: '0 */5 * * *'
  repository_dispatch:
    types: [ restart-vps ]

env:
  VPS_USER: Mikasa
  VPS_USER_LOWER: mikasa
  VPS_PASS: Eren@Home$123
  MAIN_PORT: 8080
  TTYD_PORT: 7681
  CODE_PORT: 8081
  DEBIAN_FRONTEND: noninteractive

jobs:
  vps:
    runs-on: ubuntu-latest
    timeout-minutes: 350  # 5h50m, just under 6h limit
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: System Info
        run: |
          echo "=== FreeVPS Mark1.3 System Info ==="
          echo "Date: $(date)"
          echo "Runner: $(hostname)"
          echo "OS: $(uname -a)"
          echo "User: $(whoami)"
          echo "VPS User: $VPS_USER / $VPS_USER_LOWER"
          echo "=================================="
          lscpu
          free -h
          df -h

      - name: Create VPS User Mikasa
        run: |
          echo "Creating user $VPS_USER_LOWER with password..."
          sudo useradd -m -s /bin/bash $VPS_USER_LOWER || echo "User may already exist"
          echo "$VPS_USER_LOWER:$VPS_PASS" | sudo chpasswd
          sudo usermod -aG sudo $VPS_USER_LOWER
          echo "$VPS_USER_LOWER ALL=(ALL) NOPASSWD:ALL" | sudo tee /etc/sudoers.d/$VPS_USER_LOWER
          sudo chmod 440 /etc/sudoers.d/$VPS_USER_LOWER
          
          # Also try capital M version
          sudo useradd -m -s /bin/bash Mikasa 2>/dev/null || true
          echo "Mikasa:$VPS_PASS" | sudo chpasswd 2>/dev/null || true
          sudo usermod -aG sudo Mikasa 2>/dev/null || true
          
          echo "✅ Users created:"
          id $VPS_USER_LOWER
          id Mikasa 2>/dev/null || echo "Mikasa user (capital) check done"

      - name: Install System Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            curl wget git htop nano vim tmux screen \
            openssh-server supervisor net-tools lsof \
            unzip zip build-essential python3 python3-pip \
            neofetch jq fail2ban ufw \
            libssl-dev
          
          # Install ttyd
          echo "Installing ttyd..."
          sudo apt-get install -y ttyd 2>/dev/null || {
            wget -q https://github.com/tsl0922/ttyd/releases/download/1.7.7/ttyd.x86_64 -O /tmp/ttyd
            chmod +x /tmp/ttyd
            sudo mv /tmp/ttyd /usr/local/bin/ttyd
          }
          ttyd --version || echo "ttyd installed"
          
          # Install code-server
          echo "Installing code-server..."
          curl -fsSL https://code-server.dev/install.sh | sh
          code-server --version || echo "code-server installed"

      - name: Setup SSH Server
        run: |
          sudo mkdir -p /var/run/sshd /run/sshd
          sudo sed -i 's/#*PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo sed -i 's/#*PermitRootLogin.*/PermitRootLogin yes/' /etc/ssh/sshd_config
          sudo sed -i 's/#*PubkeyAuthentication.*/PubkeyAuthentication yes/' /etc/ssh/sshd_config
          sudo ssh-keygen -A
          sudo /usr/sbin/sshd || sudo service ssh start
          echo "✅ SSH Server Status:"
          sudo service ssh status || pgrep sshd
          echo "SSH listening on:"
          sudo ss -tlnp | grep :22 || true

      - name: Install Node Dependencies
        run: |
          npm ci || npm install
          echo "Node modules installed"

      - name: Setup Tailscale (Optional)
        if: ${{ github.event.inputs.enable_tailscale == 'true' || secrets.TAILSCALE_AUTHKEY != '' }}
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          if [ -n "${{ secrets.TAILSCALE_AUTHKEY }}" ]; then
            echo "Starting Tailscale with authkey..."
            sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTHKEY }} --hostname=freevps-mark1-3-${{ github.run_id }} || echo "Tailscale up failed, may need manual"
            tailscale ip -4 || echo "Tailscale IP not yet available"
          else
            echo "Tailscale installed but no authkey secret, skipping auto-connect"
            echo "Set TAILSCALE_AUTHKEY secret to auto-connect"
          fi

      - name: Setup Ngrok (Optional)
        if: ${{ secrets.NGROK_AUTH_TOKEN != '' }}
        run: |
          echo "Installing ngrok..."
          curl -s https://ngrok.com/download/deb | sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt-get update && sudo apt-get install ngrok -y
          ngrok config add-authtoken ${{ secrets.NGROK_AUTH_TOKEN }}
          echo "✅ Ngrok configured"

      - name: Create MOTD and Welcome
        run: |
          sudo tee /etc/motd << EOF
          ╔════════════════════════════════════════════════════╗
          ║         FreeVPS Mark1.3 - 24/7 VPS ONLINE          ║
          ╠════════════════════════════════════════════════════╣
          ║  Username: Mikasa                                   ║
          ║  Password: Eren@Home\$123                            ║
          ║  Status:   24/7 Active via GitHub Actions           ║
          ║  Run ID:   ${{ github.run_id }}                     ║
          ║  Access:   SSH, Web Terminal, VS Code, ttyd         ║
          ╚════════════════════════════════════════════════════╝

          Welcome, Mikasa! Your VPS is ready.

          Access:
            - Dashboard: http://localhost:8080 (Mikasa / Eren@Home\$123)
            - ttyd: http://localhost:7681
            - code-server: http://localhost:8081
            - SSH: ssh mikasa@localhost

          Keep alive: 24/7 via workflow schedule

          EOF
          cat /etc/motd

      - name: Start VPS Services
        run: |
          echo "=== Starting FreeVPS Services ==="
          
          # Make scripts executable
          chmod +x scripts/*.sh
          chmod +x start-vps.sh
          
          # Start main dashboard
          echo "Starting main dashboard on port $MAIN_PORT..."
          PORT=$MAIN_PORT VPS_USER=$VPS_USER VPS_PASS="$VPS_PASS" nohup node server.js > /tmp/dashboard.log 2>&1 &
          echo $! > /tmp/dashboard.pid
          sleep 3
          cat /tmp/dashboard.log || true
          
          # Start ttyd
          if [ "${{ github.event.inputs.enable_ttyd }}" != "false" ]; then
            echo "Starting ttyd on port $TTYD_PORT..."
            nohup ttyd -p $TTYD_PORT -c $VPS_USER_LOWER:$VPS_PASS bash > /tmp/ttyd.log 2>&1 &
            echo $! > /tmp/ttyd.pid
            sleep 2
          fi
          
          # Start code-server
          if [ "${{ github.event.inputs.enable_code_server }}" != "false" ]; then
            echo "Starting code-server on port $CODE_PORT..."
            mkdir -p ~/.config/code-server
            cat > ~/.config/code-server/config.yaml << EOC
          bind-addr: 0.0.0.0:$CODE_PORT
          auth: password
          password: $VPS_PASS
          cert: false
          EOC
            nohup code-server --bind-addr 0.0.0.0:$CODE_PORT --auth password > /tmp/code-server.log 2>&1 &
            echo $! > /tmp/code-server.pid
            sleep 3
          fi
          
          # Start ngrok tunnels if token exists
          if [ -n "${{ secrets.NGROK_AUTH_TOKEN }}" ]; then
            echo "Starting ngrok tunnels..."
            nohup ngrok http $MAIN_PORT --log=/tmp/ngrok-dashboard.log > /tmp/ngrok.log 2>&1 &
            nohup ngrok http $TTYD_PORT --log=/tmp/ngrok-ttyd.log > /tmp/ngrok-ttyd2.log 2>&1 &
            nohup ngrok http $CODE_PORT --log=/tmp/ngrok-code.log > /tmp/ngrok-code.log 2>&1 &
            sleep 5
            curl -s http://localhost:4040/api/tunnels | jq || cat /tmp/ngrok.log
          fi
          
          echo "=== Services Status ==="
          ps aux | grep -E "server.js|ttyd|code-server|sshd|ngrok" | grep -v grep || true
          echo ""
          echo "Listening ports:"
          ss -tlnp | grep -E "$MAIN_PORT|$TTYD_PORT|$CODE_PORT|22" || netstat -tlnp | grep -E "$MAIN_PORT|$TTYD_PORT|$CODE_PORT|22" || true
          echo ""
          echo "=== Access Info ==="
          echo "Dashboard: http://localhost:$MAIN_PORT"
          echo "User: $VPS_USER / $VPS_PASS"
          echo "ttyd: http://localhost:$TTYD_PORT"
          echo "code-server: http://localhost:$CODE_PORT"

      - name: Setup tmate Session (SSH Access)
        if: ${{ github.event.inputs.enable_tmate != 'false' }}
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: false
          detached: true

      - name: Keep Alive 24/7 - Heartbeat Loop
        run: |
          echo "╔════════════════════════════════════════════════════╗"
          echo "║         FreeVPS Mark1.3 - 24/7 VPS ONLINE          ║"
          echo "╠════════════════════════════════════════════════════╣"
          echo "║  Username: Mikasa                                   ║"
          echo "║  Password: Eren@Home\$123                            ║"
          echo "║  Run ID: ${{ github.run_id }}                       ║"
          echo "║  Started: $(date)                      ║"
          echo "╚════════════════════════════════════════════════════╝"
          echo ""
          echo "🔗 Access Methods:"
          echo "  • tmate SSH: Check above logs for SSH command"
          echo "  • Web Dashboard: Will be exposed via Actions logs"
          echo "  • Tailscale: $(tailscale ip -4 2>/dev/null || echo 'Not connected, set TAILSCALE_AUTHKEY secret')"
          echo "  • Ngrok: Check ngrok dashboard if token set"
          echo ""
          echo "📊 System Status:"
          neofetch || uname -a
          echo ""
          
          # Create keepalive file
          mkdir -p keepalive
          echo "$(date) - VPS Started - Run ${{ github.run_id }}" >> keepalive/uptime.log
          
          # Heartbeat loop - runs until timeout (350 min)
          echo "Starting 24/7 heartbeat loop (will run for ~5h50m, then auto-restart via schedule)..."
          echo "To keep 24/7: This workflow auto-restarts every 5 hours via cron schedule"
          echo ""
          
          COUNT=0
          while true; do
            COUNT=$((COUNT+1))
            echo "[$(date)] 💓 Heartbeat #$COUNT - Uptime: $(uptime -p) - Load: $(cat /proc/loadavg | awk '{print $1}')"
            echo "[$(date)] Services: $(ps aux | grep -E 'server.js|ttyd|code-server' | grep -v grep | wc -l) running, Dashboard PID: $(cat /tmp/dashboard.pid 2>/dev/null || echo 'unknown')"
            
            # Restart dashboard if down
            if ! ps -p $(cat /tmp/dashboard.pid 2>/dev/null) > /dev/null 2>&1; then
              echo "[$(date)] ⚠️ Dashboard down, restarting..."
              PORT=$MAIN_PORT VPS_USER=$VPS_USER VPS_PASS="$VPS_PASS" nohup node server.js > /tmp/dashboard.log 2>&1 &
              echo $! > /tmp/dashboard.pid
            fi
            
            # Show ngrok URLs if available
            if [ -n "${{ secrets.NGROK_AUTH_TOKEN }}" ]; then
              echo "[$(date)] Ngrok tunnels:"
              curl -s http://localhost:4040/api/tunnels 2>/dev/null | jq -r '.tunnels[] | "  - \(.name): \(.public_url) -> \(.config.addr)"' 2>/dev/null || echo "  Ngrok API not ready"
            fi
            
            # Tailscale IP
            if command -v tailscale &> /dev/null; then
              TAIL_IP=$(tailscale ip -4 2>/dev/null || echo "")
              if [ -n "$TAIL_IP" ]; then
                echo "[$(date)] Tailscale IP: $TAIL_IP - SSH: ssh $VPS_USER_LOWER@$TAIL_IP"
              fi
            fi
            
            # Save heartbeat to file for persistence check
            echo "$(date) - Heartbeat #$COUNT - $(uptime)" >> keepalive/heartbeat.log
            tail -100 keepalive/heartbeat.log > /tmp/hb.tmp && mv /tmp/hb.tmp keepalive/heartbeat.log
            
            # Sleep 5 minutes
            sleep 300
          done

      - name: Auto-Restart Workflow for 24/7 (on timeout)
        if: always()
        run: |
          echo "Workflow ending, attempting auto-restart for 24/7..."
          # This will be handled by schedule cron, but we can also try to trigger via API if GH_TOKEN exists
          if [ -n "${{ secrets.GH_PAT }}" ]; then
            echo "Triggering restart via GH_PAT..."
            curl -X POST -H "Authorization: token ${{ secrets.GH_PAT }}" -H "Accept: application/vnd.github.v3+json" https://api.github.com/repos/${{ github.repository }}/actions/workflows/vps-24-7.yml/dispatches -d '{"ref":"main"}' || echo "Restart trigger failed"
          else
            echo "No GH_PAT secret, relying on cron schedule (every 5h) for 24/7 restart"
            echo "To enable instant restart, create a PAT and add as GH_PAT secret"
          fi

  # Optional second job for monitoring
  keepalive-ping:
    runs-on: ubuntu-latest
    if: always()
    needs: vps
    steps:
      - name: Keepalive Ping
        run: |
          echo "VPS job finished at $(date)"
          echo "Next run scheduled via cron in ~5 hours for 24/7"
